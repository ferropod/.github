name: Bug Report
description: Report a bug or unexpected behavior in ferropod
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `ferropod serve ...`
        2. Send request ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, RAM, ferropod version/commit, and profile (`standard` / `low-mem`).

name: Feature Request
description: Propose a new feature or enhancement for ferropod
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the design, API, or CLI behavior you have in mind.
    validations:
      required: true
